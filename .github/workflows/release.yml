name: Release (GHCR image)

# Builds and pushes the Overpass Styler container image to GHCR on a semver tag.
# Consumed by the OSINT App Bundler (https://github.com/bhngyn/osint-app-bundler).
#
# Trigger: git tag vX.Y.Z && git push --tags
# Output:  ghcr.io/bhngyn/overpass-styler:vX.Y.Z + :latest

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3). Used only for manual runs."
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.tag }}" >>"$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bhngyn/overpass-styler:${{ steps.ver.outputs.version }}
            ghcr.io/bhngyn/overpass-styler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
